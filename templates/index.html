<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EDTA-OCR 数据库查看器</title>
<style>
  :root {
    --bg: #f4f6f9;
    --card: #fff;
    --border: #e2e8f0;
    --text: #1a202c;
    --muted: #718096;
    --accent: #3182ce;
    --accent-hover: #2c5282;
    --green: #38a169;
    --red: #e53e3e;
    --radius: 8px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans SC", sans-serif; background: var(--bg); color: var(--text); line-height: 1.6; }
  .container { max-width: 1320px; margin: 0 auto; padding: 16px 20px; }

  /* Header */
  header { background: var(--card); border-bottom: 1px solid var(--border); padding: 14px 0; margin-bottom: 20px; }
  header .container { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px; }
  header h1 { font-size: 1.3rem; font-weight: 700; }
  .stats { display: flex; gap: 16px; font-size: .85rem; color: var(--muted); }
  .stats span { background: var(--bg); padding: 4px 10px; border-radius: 12px; }

  /* Toolbar */
  .toolbar { display: flex; gap: 10px; margin-bottom: 16px; flex-wrap: wrap; align-items: center; }
  .toolbar input, .toolbar select { padding: 8px 12px; border: 1px solid var(--border); border-radius: var(--radius); font-size: .9rem; outline: none; }
  .toolbar input:focus, .toolbar select:focus { border-color: var(--accent); box-shadow: 0 0 0 2px rgba(49,130,206,.15); }
  .toolbar input { flex: 1; min-width: 200px; }
  .toolbar select { max-width: 280px; }

  /* Table */
  .table-wrap { background: var(--card); border-radius: var(--radius); border: 1px solid var(--border); overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: .88rem; }
  th, td { padding: 10px 12px; text-align: left; white-space: nowrap; }
  th { background: #f7fafc; font-weight: 600; color: var(--muted); font-size: .8rem; text-transform: uppercase; letter-spacing: .03em; position: sticky; top: 0; border-bottom: 2px solid var(--border); }
  th.sortable { cursor: pointer; user-select: none; }
  th.sortable:hover { color: var(--accent); background: #ebf4fb; }
  th .sort-arrow { margin-left: 3px; font-size: .7rem; }
  td { border-bottom: 1px solid var(--border); }
  tr:hover td { background: #edf2f7; cursor: pointer; }
  .img-indicator { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--green); margin-right: 4px; }
  .no-img .img-indicator { background: #cbd5e0; }

  /* Pagination */
  .pagination { display: flex; align-items: center; justify-content: center; gap: 6px; margin-top: 16px; flex-wrap: wrap; }
  .pagination button { padding: 6px 14px; border: 1px solid var(--border); border-radius: var(--radius); background: var(--card); cursor: pointer; font-size: .85rem; }
  .pagination button:hover:not(:disabled) { background: var(--accent); color: #fff; border-color: var(--accent); }
  .pagination button:disabled { opacity: .4; cursor: default; }
  .pagination .page-info { font-size: .85rem; color: var(--muted); padding: 0 8px; }

  /* Modal */
  .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.5); z-index: 100; justify-content: center; align-items: center; }
  .modal-overlay.open { display: flex; }
  .modal { background: var(--card); border-radius: var(--radius); max-width: 720px; width: 95%; max-height: 90vh; overflow-y: auto; box-shadow: 0 20px 60px rgba(0,0,0,.2); }
  .modal-header { display: flex; justify-content: space-between; align-items: center; padding: 16px 20px; border-bottom: 1px solid var(--border); }
  .modal-header h2 { font-size: 1.1rem; }
  .modal-close { width: 32px; height: 32px; border: none; background: none; font-size: 1.4rem; cursor: pointer; color: var(--muted); border-radius: 50%; display: flex; align-items: center; justify-content: center; }
  .modal-close:hover { background: var(--bg); }
  .modal-body { padding: 20px; }
  .detail-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 12px; margin-bottom: 16px; }
  .detail-item { }
  .detail-item .label { font-size: .75rem; color: var(--muted); text-transform: uppercase; letter-spacing: .03em; }
  .detail-item .value { font-size: .95rem; font-weight: 500; margin-top: 2px; }
  .detail-image { text-align: center; margin-top: 16px; }
  .detail-image img { max-width: 100%; max-height: 480px; border-radius: var(--radius); border: 1px solid var(--border); }
  .detail-ocr { margin-top: 16px; }
  .detail-ocr h3 { font-size: .85rem; color: var(--muted); margin-bottom: 6px; }
  .detail-ocr pre { background: var(--bg); padding: 12px; border-radius: var(--radius); font-size: .82rem; white-space: pre-wrap; word-break: break-all; max-height: 150px; overflow-y: auto; }

  .empty { text-align: center; padding: 40px 20px; color: var(--muted); }

  @media (max-width: 768px) {
    .container { padding: 10px 12px; }
    header .container { flex-direction: column; align-items: flex-start; }
    th, td { padding: 8px 6px; font-size: .8rem; }
  }
</style>
</head>
<body>
<header>
  <div class="container">
    <h1>🩸 EDTA-OCR 数据库查看器</h1>
    <div class="stats">
      <span id="stat-total">总记录: …</span>
      <span id="stat-bullet">有图片: …</span>
      <a href="/logout" style="color:var(--muted);text-decoration:none;margin-left:4px;" title="退出登录">⏻</a>
    </div>
  </div>
</header>

<div class="container">
  <!-- Toolbar -->
  <div class="toolbar">
    <input type="text" id="search" placeholder="搜索：姓名 / 住院号 / 子弹头编号 / 床号 …" autofocus>
    <select id="dept-filter">
      <option value="">全部科室</option>
    </select>
    <span style="font-size:.8rem;color:var(--muted);white-space:nowrap;">
      首管
      <input type="text" id="start-bullet" value="2801" placeholder="最小" style="width:72px;padding:4px 6px;">
      →盒
      <input type="number" id="first-box" value="34" min="1" style="width:52px;padding:4px 6px;">
      孔
      <input type="number" id="first-hole" value="29" min="1" max="81" style="width:48px;padding:4px 6px;">
    </span>
    <button id="export-btn" style="padding:8px 16px;background:var(--green);color:#fff;border:none;border-radius:var(--radius);cursor:pointer;font-size:.85rem;font-weight:600;white-space:nowrap;">📥 导出 Excel</button>
  </div>

  <!-- Table -->
  <div class="table-wrap">
    <table>
      <thead>
        <tr id="header-row"></tr>
      </thead>
      <tbody id="tbody">
        <tr><td colspan="10" class="empty" id="loading-row">加载中…</td></tr>
      </tbody>
    </table>
  </div>

  <!-- Pagination -->
  <div class="pagination" id="pagination"></div>
</div>

<!-- Detail Modal -->
<div class="modal-overlay" id="modal-overlay">
  <div class="modal">
    <div class="modal-header">
      <h2 id="modal-title">记录详情</h2>
      <button class="modal-close" id="modal-close">&times;</button>
    </div>
    <div class="modal-body" id="modal-body"></div>
  </div>
</div>

<script>
// ── State ──
let currentPage = 1;
let totalPages = 1;
let sortCol = 'bullet';
let sortOrder = 'asc';

// Column definitions: key → display label
const COLUMNS = [
  {key: 'name',  label: '姓名'},
  {key: 'gender',label: '性别'},
  {key: 'age',   label: '年龄'},
  {key: 'serial',label: '住院号'},
  {key: 'bullet',label: '子弹头编号'},
  {key: 'time',  label: '采血时间'},
  {key: 'dept',  label: '科室'},
  {key: 'bed',   label: '床号'},
  {key: 'saved', label: '录入时间'},
  {key: 'boxhole', label: '盒·孔'},
];

// ── Init ──
async function init() {
  renderHeaders();
  await Promise.all([loadStats(), loadBoxConfig(), loadDepartments()]);
  await loadRecords();
  bindEvents();
}

async function loadBoxConfig() {
  const r = await fetch("/api/box-config").then(r => r.json());
  if (r.firstBox)    document.getElementById("first-box").value = r.firstBox;
  if (r.firstHole)   document.getElementById("first-hole").value = r.firstHole;
  if (r.startBullet) document.getElementById("start-bullet").value = r.startBullet;
  document.getElementById("start-bullet").placeholder = r.minBullet ? `最小: ${r.minBullet}` : '最小';
}

async function loadStats() {
  const r = await fetch("/api/stats").then(r => r.json());
  document.getElementById("stat-total").textContent = `总记录: ${r.total.toLocaleString()}`;
  document.getElementById("stat-bullet").textContent = `有图片: ${r.with_bullet.toLocaleString()}`;
}

async function loadDepartments() {
  const depts = await fetch("/api/departments").then(r => r.json());
  const sel = document.getElementById("dept-filter");
  depts.forEach(d => {
    const opt = document.createElement("option");
    opt.value = d.name;
    opt.textContent = `${d.name} (${d.count})`;
    sel.appendChild(opt);
  });
}

async function loadRecords() {
  const q = document.getElementById("search").value.trim();
  const dept = document.getElementById("dept-filter").value;
  const params = new URLSearchParams({ page: currentPage, q, dept, sort: sortCol, order: sortOrder });
  const data = await fetch("/api/records?" + params).then(r => r.json());

  // Sync sort state back from server response
  sortCol = data.sort || 'id';
  sortOrder = (data.order || 'ASC').toLowerCase();
  renderHeaders();

  currentPage = data.page;
  totalPages = data.total_pages;

  // update search bar placeholder with total
  document.getElementById("search").placeholder =
    data.total ? `搜索 ${data.total.toLocaleString()} 条记录 …` : "无结果";

  const tbody = document.getElementById("tbody");
  if (!data.records.length) {
    tbody.innerHTML = `<tr><td colspan="${COLUMNS.length}" class="empty">没有匹配的记录</td></tr>`;
    renderPagination();
    return;
  }

  tbody.innerHTML = data.records.map(r => `
    <tr class="${r.has_image ? '' : 'no-img'}" data-id="${r.id}">
      <td><span class="img-indicator"></span>${esc(r.name)}</td>
      <td>${esc(r.gender)}</td>
      <td>${esc(r.age)}</td>
      <td>${esc(r.serial)}</td>
      <td>${esc(r.bullet)}</td>
      <td>${esc(r.time)}</td>
      <td>${esc(r.dept)}</td>
      <td>${esc(r.bed)}</td>
      <td>${esc(r.saved)}</td>
      <td style="font-family:monospace;font-size:.82rem;color:${r.box==null?'var(--muted)':''};">${r.box != null ? `${r.box}-${r.hole}` : 'NA'}</td>
    </tr>
  `).join("");

  renderPagination();
}

function renderHeaders() {
  const row = document.getElementById('header-row');
  row.innerHTML = COLUMNS.map(c => {
    const arrow = c.key === sortCol ? `<span class="sort-arrow">${sortOrder === 'asc' ? '▲' : '▼'}</span>` : '';
    return `<th class="sortable" data-sort="${c.key}">${c.label}${arrow}</th>`;
  }).join('');
}

function renderPagination() {
  const div = document.getElementById("pagination");
  let html = "";
  html += `<button ${currentPage <= 1 ? "disabled" : ""} data-page="${currentPage - 1}">上一页</button>`;
  html += `<span class="page-info">第 ${currentPage} / ${totalPages} 页</span>`;
  html += `<button ${currentPage >= totalPages ? "disabled" : ""} data-page="${currentPage + 1}">下一页</button>`;
  div.innerHTML = html;
}

function bindEvents() {
  // Search with debounce
  let timer = null;
  document.getElementById("search").addEventListener("input", function() {
    clearTimeout(timer);
    timer = setTimeout(() => { currentPage = 1; loadRecords(); }, 250);
  });

  // Sort column click
  document.getElementById("header-row").addEventListener("click", function(e) {
    const th = e.target.closest("th.sortable");
    if (!th) return;
    const key = th.dataset.sort;
    if (key === sortCol) {
      sortOrder = sortOrder === 'asc' ? 'desc' : 'asc';
    } else {
      sortCol = key;
      sortOrder = 'asc';
    }
    currentPage = 1;
    loadRecords();
  });

  // Box config changes
  async function onBoxConfigChange() {
    const firstBox  = parseInt(document.getElementById("first-box").value) || 1;
    const firstHole = parseInt(document.getElementById("first-hole").value) || 1;
    const startBullet = document.getElementById("start-bullet").value.trim() || null;
    await fetch("/api/box-config", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({firstBox, firstHole, startBullet}),
    });
    currentPage = 1;
    loadRecords();
  }
  document.getElementById("first-box").addEventListener("change", onBoxConfigChange);
  document.getElementById("first-hole").addEventListener("change", onBoxConfigChange);
  document.getElementById("start-bullet").addEventListener("change", onBoxConfigChange);

  // Export button
  document.getElementById("export-btn").addEventListener("click", function() {
    const q = document.getElementById("search").value.trim();
    const dept = document.getElementById("dept-filter").value;
    const params = new URLSearchParams({ q, dept, sort: sortCol, order: sortOrder });
    window.open("/api/export?" + params, "_blank");
  });

  // Department filter
  document.getElementById("dept-filter").addEventListener("change", function() {
    currentPage = 1;
    loadRecords();
  });

  // Pagination clicks
  document.getElementById("pagination").addEventListener("click", function(e) {
    const btn = e.target.closest("button");
    if (!btn || btn.disabled) return;
    const p = parseInt(btn.dataset.page);
    if (p > 0 && p <= totalPages) { currentPage = p; loadRecords(); }
  });

  // Row click → detail modal
  document.getElementById("tbody").addEventListener("click", function(e) {
    const tr = e.target.closest("tr");
    if (!tr || !tr.dataset.id) return;
    openDetail(tr.dataset.id);
  });

  // Modal keyboard nav & close
  document.addEventListener("keydown", function(e) {
    const overlay = document.getElementById("modal-overlay");
    const open = overlay.classList.contains("open");
    if (!open) return;

    if (e.key === "Escape") { closeModal(); return; }

    // Arrow keys to navigate while modal is open
    const currentId = parseInt(overlay.dataset.recordId);
    if (e.key === "ArrowUp" || e.key === "ArrowLeft" || e.key === "ArrowDown" || e.key === "ArrowRight") {
      e.preventDefault();
      const dir = (e.key === "ArrowDown" || e.key === "ArrowRight") ? 1 : -1;
      navigateRecord(currentId, dir);
    }
  });

  // J/K keys for navigation (vim-style)
  document.addEventListener("keydown", function(e) {
    if (document.getElementById("modal-overlay").classList.contains("open")) return;
    if (e.target.tagName === "INPUT" || e.target.tagName === "SELECT") return;
    if (e.key === "j" || e.key === "k") {
      // find current row and move
      const rows = [...document.querySelectorAll("#tbody tr[data-id]")];
      if (!rows.length) return;
      const idx = rows.findIndex(r => r.matches(":focus"));
      const nextIdx = e.key === "j" ? Math.min(idx + 1, rows.length - 1)
                   : Math.max(idx - 1, 0);
      if (nextIdx >= 0 && nextIdx < rows.length) {
        rows[nextIdx].focus();
        rows[nextIdx].scrollIntoView({ block: "nearest" });
      }
    }
    if (e.key === "Enter" && document.activeElement?.dataset?.id) {
      openDetail(document.activeElement.dataset.id);
    }
  });

  document.getElementById("modal-close").addEventListener("click", closeModal);
  document.getElementById("modal-overlay").addEventListener("click", function(e) {
    if (e.target === this) closeModal();
  });
}

// ── Detail Modal ──
async function openDetail(id) {
  const overlay = document.getElementById("modal-overlay");
  overlay.dataset.recordId = id;
  document.getElementById("modal-title").textContent = `记录 #${id}`;
  document.getElementById("modal-body").innerHTML = '<div class="empty">加载中…</div>';
  overlay.classList.add("open");

  const r = await fetch(`/api/record/${id}`).then(r => r.json());
  if (r.error) { document.getElementById("modal-body").innerHTML = `<div class="empty">${r.error}</div>`; return; }

  document.getElementById("modal-title").textContent = `记录 #${r.id} — ${r.name}`;
  document.getElementById("modal-body").innerHTML = `
    <div class="detail-grid">
      <div class="detail-item"><div class="label">姓名</div><div class="value">${esc(r.name)}</div></div>
      <div class="detail-item"><div class="label">性别</div><div class="value">${esc(r.gender)}</div></div>
      <div class="detail-item"><div class="label">年龄</div><div class="value">${esc(r.age)}</div></div>
      <div class="detail-item"><div class="label">住院号</div><div class="value">${esc(r.serial)}</div></div>
      <div class="detail-item"><div class="label">子弹头编号</div><div class="value">${esc(r.bullet)}</div></div>
      <div class="detail-item"><div class="label">采血时间</div><div class="value">${esc(r.time)}</div></div>
      <div class="detail-item"><div class="label">科室</div><div class="value">${esc(r.dept)}</div></div>
      <div class="detail-item"><div class="label">床号</div><div class="value">${esc(r.bed)}</div></div>
      <div class="detail-item"><div class="label">录入时间</div><div class="value">${esc(r.saved)}</div></div>
      <div class="detail-item"><div class="label">盒·孔</div><div class="value" style="${r.box==null?'color:var(--muted);':''}">${r.box != null ? `${r.box}-${r.hole}` : 'NA'}</div></div>
    </div>
    ${r.id ? `<div class="detail-image"><img src="/captures/${r.id}.png" alt="Captured image for #${r.id}" onerror="this.parentElement.innerHTML='<div class=\\'empty\\'>图片不存在</div>'"></div>` : '<div class="empty">无关联图片</div>'}
    ${r.ocr ? `<div class="detail-ocr"><h3>原始 OCR 文本</h3><pre>${esc(r.ocr)}</pre></div>` : ''}
  `;
}

function navigateRecord(currentId, direction) {
  // Fetch neighbor record IDs from current page
  const rows = [...document.querySelectorAll("#tbody tr[data-id]")];
  const ids = rows.map(r => parseInt(r.dataset.id));
  const idx = ids.indexOf(currentId);
  let newIdx = idx + direction;
  if (newIdx < 0 || newIdx >= ids.length) return;
  openDetail(ids[newIdx]);
}

function closeModal() {
  document.getElementById("modal-overlay").classList.remove("open");
}

function esc(s) {
  if (!s) return "";
  const div = document.createElement("div");
  div.textContent = s;
  return div.innerHTML;
}

init();
</script>
</body>
</html>
