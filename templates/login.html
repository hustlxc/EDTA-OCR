<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>登录 — EDTA-OCR 数据库查看器</title>
<style>
  :root {
    --bg: #f4f6f9;
    --card: #fff;
    --border: #e2e8f0;
    --text: #1a202c;
    --muted: #718096;
    --accent: #3182ce;
    --accent-hover: #2c5282;
    --red: #e53e3e;
    --radius: 8px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans SC", sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .login-box {
    background: var(--card);
    border-radius: var(--radius);
    border: 1px solid var(--border);
    padding: 40px 36px;
    width: 360px;
    max-width: 95vw;
    box-shadow: 0 4px 24px rgba(0,0,0,.06);
  }
  .login-box h1 {
    font-size: 1.2rem;
    text-align: center;
    margin-bottom: 24px;
  }
  .field { margin-bottom: 16px; }
  .field label {
    display: block;
    font-size: .8rem;
    color: var(--muted);
    margin-bottom: 4px;
    font-weight: 600;
  }
  .field input {
    width: 100%;
    padding: 10px 12px;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    font-size: .95rem;
    outline: none;
  }
  .field input:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 2px rgba(49,130,206,.15);
  }
  button {
    width: 100%;
    padding: 10px 0;
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: var(--radius);
    font-size: .95rem;
    font-weight: 600;
    cursor: pointer;
    margin-top: 8px;
  }
  button:hover { background: var(--accent-hover); }
  .error {
    background: #fff5f5;
    color: var(--red);
    padding: 8px 12px;
    border-radius: var(--radius);
    font-size: .85rem;
    margin-bottom: 16px;
    text-align: center;
  }
</style>
</head>
<body>
<div class="login-box">
  <h1>🩸 EDTA-OCR 数据库查看器</h1>
  {% if error %}
    <div class="error">{{ error }}</div>
  {% endif %}
  <form method="post">
    <div class="field">
      <label for="username">用户名</label>
      <input type="text" id="username" name="username" autofocus autocomplete="username" required>
    </div>
    <div class="field">
      <label for="password">密码</label>
      <input type="password" id="password" name="password" autocomplete="current-password" required>
    </div>
    <button type="submit">登录</button>
  </form>
</div>
</body>
</html>
